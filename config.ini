# ============================================================
# V93K RAG 问答系统配置文件
# 说明：
#   - 路径支持相对 my_pro 项目根目录
#   - dashscope_api_key 留空时优先读环境变量 DASHSCOPE_API_KEY
# ============================================================

[llm]
model = glm-4.5-air
dashscope_api_key = bc19e749de21485594009d5f604c1358.LHk2PbvJRnoBSvq1
dashscope_base_url = https://open.bigmodel.cn/api/paas/v4
temperature = 0.3
strategy_temperature = 0.1

[embedding]
# FlagEmbedding 加载的本地路径（同时输出稠密 1024 维 + 稀疏 lexical weights）
model_dir = ./models/bge-m3
device = cpu
use_fp16 = false
max_length = 512

[chroma]
persist_dir = ./chroma_data
collection_name = v93k_kb
parents_collection_name = v93k_kb_parents
distance_metric = cosine

[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 5
candidate_m = 3
faq_similarity_threshold = 0.35

[rerank]
# 指向 EduRag 项目下的本地权重（按用户确认）
enabled = true
model_path = D:/workspace/python/RAG_project/learning/EduRag/rag_qa/models/bge-reranker-large
device = cpu
use_fp16 = false

[ocr]
use_cuda = false
pdf_image_threshold = 0.6

[app]
host = 0.0.0.0
port = 8000
data_dir = ./data

[logger]
log_file = logs/app.log
log_level = INFO

[mysql]
host = localhost
port = 3306
user = root
password = rootroot
database = v93k_rag
